{% extends "base.html" %}

{% block title %}Connexion - Marki App{% endblock %}

{% block content %}
<div x-data="loginForm()" class="container mx-auto p-4">
    <div class="flex justify-center items-center h-screen">
        <div x-ref="loginContainer" class="w-full max-w-md">
            <div class="text-center mb-8">
                <img src="/static/images/marki-logo.png" alt="Marki Logo" class="h-16 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-text">Connexion</h1>
            </div>
            
            <form x-ref="loginForm" @submit.prevent="submitForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                <div x-ref="idInputContainer" class="mb-4">
                    <label class="block text-text text-sm font-bold mb-2" for="id">
                        Identifiant
                    </label>
                    <input x-ref="idInput" x-model="id" class="shadow appearance-none border border-border rounded w-full py-2 px-3 text-text leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="id" type="text" placeholder="Identifiant" required>
                    <div x-ref="idError" x-text="idError" class="text-error text-xs italic"></div>
                </div>
                
                <div x-ref="passwordInputContainer" class="mb-6">
                    <label class="block text-text text-sm font-bold mb-2" for="password">
                        Mot de passe
                    </label>
                    <input x-ref="passwordInput" x-model="password" class="shadow appearance-none border border-border rounded w-full py-2 px-3 text-text mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="password" type="password" placeholder="******************" required>
                    <div x-ref="passwordError" x-text="passwordError" class="text-error text-xs italic"></div>
                </div>
                
                <div x-ref="buttonContainer" class="flex items-center justify-between">
                    <button x-ref="submitButton" class="bg-primary hover:bg-primary-dark text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors" type="submit">
                        Se connecter
                    </button>
                    <button x-ref="forgotPasswordButton" @click="openForgotPasswordDrawer" class="inline-block align-baseline font-bold text-sm text-primary hover:text-primary-dark transition-colors" type="button">
                        Mot de passe oublié ?
                    </button>
                </div>
                
                <div x-ref="registerButtonContainer" class="mt-4 text-center">
                    <button x-ref="registerButton" @click="openDrawer" class="inline-block align-baseline font-bold text-sm text-primary hover:text-primary-dark transition-colors" type="button">
                        S'inscrire
                    </button>
                </div>
                
                {% if error %}
                <div x-ref="errorMessage" class="mt-4 bg-error bg-opacity-10 border border-error text-error px-4 py-3 rounded relative" role="alert">
                    <span class="block sm:inline">{{ error }}</span>
                </div>
                {% endif %}
            </form>
        </div>
    </div>
    
    <!-- Inclusion des partials pour les drawers -->
    {% include 'partials/register_drawer.html' %}
    {% include 'partials/forgot_password_drawer.html' %}
</div>

<script>
function loginForm() {
    return {
        id: '',
        password: '',
        idError: '',
        passwordError: '',
        isDrawerOpen: false,
        isForgotPasswordDrawerOpen: false,
        
        openDrawer() {
            this.isDrawerOpen = true;
        },
        
        closeDrawer() {
            this.isDrawerOpen = false;
        },
        
        openForgotPasswordDrawer() {
            this.isForgotPasswordDrawerOpen = true;
        },
        
        closeForgotPasswordDrawer() {
            this.isForgotPasswordDrawerOpen = false;
        },
        
        validateId() {
            if (!this.id) {
                this.idError = 'L\'identifiant est requis.';
                return false;
            }
            this.idError = '';
            return true;
        },
        
        validatePassword() {
            if (!this.password) {
                this.passwordError = 'Le mot de passe est requis.';
                return false;
            }
            if (this.password.length < 8) {
                this.passwordError = 'Le mot de passe doit contenir au moins 8 caractères.';
                return false;
            }
            this.passwordError = '';
            return true;
        },
        
        submitForm() {
            if (this.validateId() && this.validatePassword()) {
                // Soumettre le formulaire
                this.$el.submit();
            }
        }
    };
}
</script>
{% endblock %}
