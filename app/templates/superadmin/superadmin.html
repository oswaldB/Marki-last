{% extends "layouts/app-layout.html" %}

{% block page_content %}
  <div class="container mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <img src="/static/logo.png" alt="Logo Marki" class="w-32 h-auto mx-auto mb-4">
      <h1 class="text-4xl font-bold text-text">Gestion des Admins</h1>
    </div>
    <div id="admins-list" class="mb-8">
      <h2 class="text-2xl font-semibold text-text mb-4">Liste des Admins</h2>
      <div class="overflow-x-auto bg-white rounded-lg shadow-sm border border-border">
        <table class="min-w-full divide-y divide-border">
          <thead class="bg-bg-light">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-text-light uppercase tracking-wider">ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-text-light uppercase tracking-wider">Identifiant</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-text-light uppercase tracking-wider">Nom</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-text-light uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-border">
            {% for admin in admins %}
              <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-text">{{ loop.index }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-text">{{ admin.username }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-text">{{ admin.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                  <a href="/superadmin/update/{{ loop.index }}" id="edit-admin-{{ loop.index }}" class="text-primary hover:text-primary-dark mr-2">Modifier</a>
                  <a href="/superadmin/delete/{{ loop.index }}" id="delete-admin-{{ loop.index }}" class="text-error hover:text-error-dark">Supprimer</a>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm border border-border p-6">
      <h2 class="text-2xl font-semibold text-text mb-4">Créer un Admin</h2>
      <form method="POST" action="/superadmin/create" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-text-light">Identifiant :</label>
          <input type="text" id="username" name="username" required class="w-full px-3 py-2 mt-1 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-text-light">Mot de passe :</label>
          <input type="password" id="password" name="password" required class="w-full px-3 py-2 mt-1 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        </div>
        <div>
          <label for="name" class="block text-sm font-medium text-text-light">Nom :</label>
          <input type="text" id="name" name="name" required class="w-full px-3 py-2 mt-1 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        </div>
        <button type="submit" id="create" class="px-4 py-2 text-white bg-primary rounded-md hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">Créer</button>
      </form>
    </div>
  </div>
{% endblock %}
