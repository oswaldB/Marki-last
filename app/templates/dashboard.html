{% extends "base.html" %}

{% block title %}Dashboard - Marki App{% endblock %}

{% block content %}
<div class="flex h-screen bg-bg-light">
    <!-- Sidebar -->
    <div class="w-64 bg-text text-white flex flex-col">
        <div class="p-4 border-b border-border">
            <h1 class="text-xl font-bold">Marki App</h1>
        </div>
        <nav class="flex-1 p-4">
            <ul class="space-y-2">
                <li>
                    <a href="/dashboard" class="flex items-center p-2 text-text-light hover:text-white rounded">
                        <i data-lucide="home" class="w-5 h-5 mr-3"></i>
                        <span>Accueil</span>
                    </a>
                </li>
                <li>
                    <a href="/dashboard/profile" class="flex items-center p-2 text-text-light hover:text-white rounded">
                        <i data-lucide="user" class="w-5 h-5 mr-3"></i>
                        <span>Profil</span>
                    </a>
                </li>
                <li>
                    <a href="/logout" class="flex items-center p-2 text-text-light hover:text-white rounded">
                        <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                        <span>Déconnexion</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <div>
                <span class="text-text-light">Utilisateur: </span>
                <span class="text-text font-semibold">{{ user.username if user else 'Invité' }}</span>
            </div>
            <a href="/logout" class="bg-error text-white px-4 py-2 rounded hover:bg-red-600">
                Déconnexion
            </a>
        </header>
        
        
    </div>
</div>
{% endblock %}
