{% extends "base.html" %}

{% block title %}Simple Auth Layout - Marki App{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <header class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-text">Marki App</h1>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="/dashboard" class="text-text-light hover:text-primary transition-colors">Dashboard</a></li>
                <li><a href="/profile" class="text-text-light hover:text-primary transition-colors">Profil</a></li>
                <li><a href="/logout" class="text-text-light hover:text-primary transition-colors">Déconnexion</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        {% block auth_content %}{% endblock %}
    </main>
    
    <footer class="mt-8 p-4 bg-bg-light text-center">
        <p class="text-text-light">🎨 Powered by MARKI</p>
    </footer>
</div>
{% endblock %}
