<!-- Drawer Mot de Passe Oublié -->
<div x-ref="forgotPasswordDrawer" x-show="isForgotPasswordDrawerOpen" @click.away="closeForgotPasswordDrawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div x-ref="forgotPasswordDrawerContent" class="bg-white rounded-lg shadow-xl w-full max-w-md" @click.stop>
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 x-ref="forgotPasswordDrawerTitle" class="text-xl font-bold text-text">Mot de Passe Oublié</h2>
                <button x-ref="forgotPasswordDrawerCloseButton" @click="closeForgotPasswordDrawer" class="text-text-light hover:text-text transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="mb-4">
                <p class="text-text-light">
                    Merci de contacter votre administrateur principal pour réinitialiser votre mot de passe.
                </p>
                <p class="text-text-light mt-2">
                    Si vous êtes l'administrateur principal, veuillez envoyer un email à :
                </p>
                <a href="mailto:contact@markidiags.com" class="text-primary hover:text-primary-dark transition-colors">
                    contact@markidiags.com
                </a>
            </div>
        </div>
    </div>
</div>
