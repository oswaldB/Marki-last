{% extends "layouts/simple-layout.html" %}

{% block page_content %}
  <div class="flex items-center justify-center min-h-screen bg-bg-light">
    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow-md">
      <div class="text-center">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Marki" class="w-32 h-auto mx-auto mb-6">
        <h1 class="text-3xl font-semibold text-text">Accès Superadmin</h1>
      </div>
      <form method="POST" class="mt-8 space-y-6">
        <div>
          <label for="password" class="block text-sm font-medium text-text-light">Mot de passe :</label>
          <input type="password" id="password" name="password" required class="w-full px-3 py-2 mt-1 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        </div>
        <button type="submit" id="submit" class="w-full px-4 py-2 text-white bg-primary rounded-md hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">Valider</button>
        {% if error %}
          <p class="text-error text-center">{{ error }}</p>
        {% endif %}
      </form>
    </div>
  </div>
{% endblock %}
