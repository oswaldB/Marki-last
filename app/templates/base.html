<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Marki - Gestion des Commissions{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Heroicons (SVG Sprites) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/heroicons@2.0.0/24/outline/index.css">

  <!-- Custom Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#509EE3',
            'primary-dark': '#236CB9',
            secondary: '#6D5DCF',
            success: '#4CAF50',
            error: '#F44336',
            text: '#333333',
            'text-light': '#666666',
            border: '#CCCCCC',
            'bg-light': '#F5F7FA'
          }
        }
      }
    }
  </script>

  {% block head %}{% endblock %}
</head>

<body class="bg-bg-light text-text font-inter">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
