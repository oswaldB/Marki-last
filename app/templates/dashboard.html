{% extends "base.html" %}

{% block title %}Dashboard - Marki App{% endblock %}

{% block content %}
<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-primary text-white">
        <div class="p-4">
            <h1 class="text-xl font-bold">Marki Dashboard</h1>
        </div>
        <nav class="p-4">
            <ul>
                <li class="mb-2"><a href="/dashboard" class="text-text-light hover:text-white transition-colors">Accueil</a></li>
                <li class="mb-2"><a href="/dashboard/profile" class="text-text-light hover:text-white transition-colors">Profil</a></li>
                <li class="mb-2"><a href="/logout" class="text-text-light hover:text-white transition-colors">Déconnexion</a></li>
            </ul>
        </nav>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <!-- Topbar -->
        <div class="bg-white shadow p-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-text">Tableau de bord</h2>
                <div>
                    <span class="mr-4 text-text-light">Utilisateur: {{ user.name }}</span>
                    <a href="/logout" class="bg-error hover:bg-opacity-90 text-white px-4 py-2 rounded transition-colors">Déconnexion</a>
                </div>
            </div>
        </div>
        
        <!-- Content -->
        <div class="flex-1 p-4">
            {% block dashboard_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
