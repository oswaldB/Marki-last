<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Marki</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .logo {
            width: 100px;
            height: auto;
        }
        .hello-world-text {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="/static/images/marki-logo.png" alt="Marki" class="logo">
    </div>
    <div class="hello-world-text">
        Hello World
    </div>
</body>
</html>
