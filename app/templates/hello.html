<!DOCTYPE html>
<html lang="fr" x-data="helloPageState()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonjour !</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold mb-4">
            {% if name %}
                Bonjour {{ name }} !
            {% else %}
                Bonjour !
            {% endif %}
        </h1>
        <button @click="showForm = !showForm" class="text-blue-500 underline">
            Pas le bon prénom ?
        </button>
        <div x-show="showForm" class="mt-4">
            <input type="text" x-model="newName" placeholder="Entrez votre prénom" class="p-2 border rounded">
            <button @click="changeName" class="ml-2 px-4 py-2 bg-primary text-white rounded">
                Changer
            </button>
        </div>
    </div>

    <script>
        function helloPageState() {
            return {
                currentName: '{{ name if name else "" }}',
                newName: '',
                showForm: false,
                changeName() {
                    this.currentName = this.newName;
                    this.showForm = false;
                }
            };
        }
    </script>
</body>
</html>
