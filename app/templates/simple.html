{% extends "base.html" %}

{% block title %}Simple Layout - Marki App{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center">
            <img src="/static/images/marki-logo.png" alt="Marki Logo" class="h-8 mr-4">
            <h1 class="text-2xl font-bold text-text">Marki App</h1>
        </div>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="/" class="text-text-light hover:text-primary transition-colors">Accueil</a></li>
                <li><a href="/about" class="text-text-light hover:text-primary transition-colors">À propos</a></li>
                <li><a href="/contact" class="text-text-light hover:text-primary transition-colors">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        {% block simple_content %}{% endblock %}
    </main>
    
    <footer class="mt-8 p-4 bg-bg-light text-center">
        <p class="text-text-light">🎨 Powered by MARKI</p>
    </footer>
</div>
{% endblock %}
