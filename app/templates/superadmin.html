{% extends "simple.html" %}

{% block title %}SuperAdmin - Marki App{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center">
            <img src="/static/images/marki-logo.png" alt="Marki Logo" class="h-8 mr-4">
            <h1 class="text-2xl font-bold text-text">Marki App</h1>
        </div>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="/" class="text-text-light hover:text-primary transition-colors">Accueil</a></li>
                <li><a href="/about" class="text-text-light hover:text-primary transition-colors">À propos</a></li>
                <li><a href="/contact" class="text-text-light hover:text-primary transition-colors">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="flex justify-center items-center h-screen">
            <div class="w-full max-w-md">
                <div class="text-center mb-8">
                    <img src="/static/images/marki-logo.png" alt="Marki Logo" class="h-16 mx-auto mb-4">
                    <h1 class="text-2xl font-bold text-text">SuperAdmin</h1>
                </div>
                
                <div x-data="superAdminPage()" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                    <div class="mb-4">
                        <label class="block text-text text-sm font-bold mb-2" for="protection-code">
                            Code de Protection
                        </label>
                        <input x-model="protectionCode" class="shadow appearance-none border border-border rounded w-full py-2 px-3 text-text leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="protection-code" type="text" placeholder="Entrez le code de protection">
                        <button @click="validateProtectionCode" class="mt-2 bg-primary hover:bg-primary-dark text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors" type="button">
                            Valider
                        </button>
                    </div>
                    
                    <div x-show="isProtectedContentVisible" class="mt-8">
                        <h2 class="text-xl font-bold mb-4 text-text">Gestion des Utilisateurs</h2>
                        
                        <div class="mb-4">
                            <label class="block text-text text-sm font-bold mb-2" for="user-id">
                                Identifiant
                            </label>
                            <input x-model="newUser.id" class="shadow appearance-none border border-border rounded w-full py-2 px-3 text-text leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="user-id" type="text" placeholder="Identifiant">
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-text text-sm font-bold mb-2" for="user-password">
                                Mot de passe
                            </label>
                            <input x-model="newUser.password" class="shadow appearance-none border border-border rounded w-full py-2 px-3 text-text leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="user-password" type="password" placeholder="Mot de passe">
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-text text-sm font-bold mb-2">
                                Rôle
                            </label>
                            <label class="inline-flex items-center">
                                <input x-model="newUser.isAdmin" type="checkbox" class="form-checkbox text-primary focus:ring-primary">
                                <span class="ml-2 text-text">isAdmin</span>
                            </label>
                        </div>
                        
                        <button @click="createUser" class="bg-success hover:bg-opacity-90 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-success focus:ring-opacity-50 transition-colors" type="button">
                            Créer
                        </button>
                        
                        <div class="mt-8">
                            <h2 class="text-xl font-bold mb-4 text-text">Liste des Utilisateurs</h2>
                            
                            <template x-for="user in users" :key="user.id">
                                <div class="mb-4 p-4 bg-bg-light rounded">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <p class="font-bold text-text">Identifiant: <span x-text="user.id"></span></p>
                                            <p class="text-text-light">Rôle: <span x-text="user.isAdmin ? 'Admin' : 'Utilisateur'"></span></p>
                                        </div>
                                        <div>
                                            <button @click="activateUser(user.id)" class="bg-primary hover:bg-primary-dark text-white font-bold py-1 px-2 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors mr-2" type="button">
                                                Activer
                                            </button>
                                            <button @click="modifyUser(user.id)" class="bg-secondary hover:bg-opacity-90 text-white font-bold py-1 px-2 rounded focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-opacity-50 transition-colors" type="button">
                                                Modifier
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="mt-8 p-4 bg-bg-light text-center">
        <p class="text-text-light">🎨 Powered by MARKI</p>
    </footer>
</div>

<script>
function superAdminPage() {
    return {
        protectionCode: '',
        isProtectedContentVisible: false,
        newUser: {
            id: '',
            password: '',
            isAdmin: false
        },
        users: [],
        
        validateProtectionCode() {
            if (this.protectionCode === 'Citron6-Mustang9') {
                this.isProtectedContentVisible = true;
                this.loadUsers();
            } else {
                alert('Mot de passe de protection incorrect.');
            }
        },
        
        async loadUsers() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                this.users = data.users;
            } catch (error) {
                console.error('Erreur lors du chargement des utilisateurs:', error);
            }
        },
        
        async createUser() {
            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(this.newUser)
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('Utilisateur créé avec succès.');
                    this.newUser = { id: '', password: '', isAdmin: false };
                    this.loadUsers();
                } else {
                    alert('Erreur lors de la création de l\'utilisateur.');
                }
            } catch (error) {
                console.error('Erreur lors de la création de l\'utilisateur:', error);
            }
        },
        
        async activateUser(userId) {
            try {
                const response = await fetch(`/api/users/${userId}/activate`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('Utilisateur activé avec succès.');
                    this.loadUsers();
                } else {
                    alert('Erreur lors de l\'activation de l\'utilisateur.');
                }
            } catch (error) {
                console.error('Erreur lors de l\'activation de l\'utilisateur:', error);
            }
        },
        
        async modifyUser(userId) {
            try {
                const newPassword = prompt('Entrez le nouveau mot de passe:');
                if (newPassword) {
                    const response = await fetch(`/api/users/${userId}/modify`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: newPassword })
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        alert('Mot de passe modifié avec succès.');
                        this.loadUsers();
                    } else {
                        alert('Erreur lors de la modification du mot de passe.');
                    }
                }
            } catch (error) {
                console.error('Erreur lors de la modification du mot de passe:', error);
            }
        }
    };
}
</script>
{% endblock %}
